name: Audit Cavissima Blanc Prices

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, no DB corrections)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  audit:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GSHEET_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDENTIALS_JSON }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cavissima blanc audit
        run: python -m src.audit_cavissima_blanc
