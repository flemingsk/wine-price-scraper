name: Cleanup Stale URLs May 2026

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (count only, no deletion)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  cleanup:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GSHEET_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDENTIALS_JSON }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cleanup
        run: python -m src.cleanup_stale_urls_may2026
