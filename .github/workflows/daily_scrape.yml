name: Daily Wine Price Scrape

# Triggers
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 10 * * *"  # daily at 10:00 CET (09:00 UTC)

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest

    # Environment variables from GitHub Secrets
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GSHEET_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDENTIALS_JSON }}
      GSHEET_CREDENTIALS_FILE: gspread_key.json

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write Google Sheets credentials
        run: |
          echo "$GSHEET_CREDENTIALS_JSON" > gspread_key.json
          shell: bash

      # 4️⃣ Write Google Sheets credentials JSON
      - name: Write Google Sheets credentials
        run: |
          echo "${GSHEET_CREDENTIALS_JSON}" > $GSHEET_CREDENTIALS_FILE

      # 5️⃣ Run the scraper
      - name: Run scraper
        run: |
          python -m src.app
