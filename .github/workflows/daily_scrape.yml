name: Daily Wine Price Scrape

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"  # daily at 09:00 UTC (10:00 CET / 11:00 CEST)

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GSHEET_CREDENTIALS_JSON: ${{ secrets.GSHEET_CREDENTIALS_JSON }}
      WINE_SEARCHER_API_KEY: ${{ secrets.WINE_SEARCHER_API_KEY }}  # optional — free 100 calls/day

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python -m src.app
